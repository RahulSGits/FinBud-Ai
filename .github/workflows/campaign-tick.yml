# Advances running campaigns every ~5 minutes.
#
# Vercel's Hobby plan only allows daily crons, which is far too slow for a
# dialling queue — a campaign would place one batch of calls per day. GitHub's
# scheduler is free and runs every 5 minutes (best-effort; expect occasional
# multi-minute drift), so it does the pacing and the Vercel daily cron stays on
# only as a safety net that fires as the Indian calling window opens.
#
# Setup (repo Settings → Secrets and variables → Actions):
#   secret  CRON_SECRET  — same value as the Vercel env var of that name
#   secret  APP_URL      — e.g. https://finbud-call-ai.vercel.app
#
# The tick endpoint is restart-safe and idempotent: overlapping or missed runs
# cannot double-dial a contact (contacts are claimed with a conditional update).
name: Campaign tick

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions: {}

# Scheduled runs are best-effort: GitHub sometimes cannot allocate a hosted
# runner and the job sits queued until it is cancelled ("The job was not
# acquired by Runner of type hosted"). Without this, each stalled run stays
# queued while the next one is scheduled behind it, and a backlog builds that
# makes the starvation worse. Dropping an old tick costs nothing — the endpoint
# is idempotent and the next run picks up exactly the same work.
concurrency:
  group: campaign-tick
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Tick campaigns
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            # A warning, not a silent exit 0.
            #
            # This used to print a line and pass, so the workflow showed a green
            # tick every five minutes while dialling nothing and reconciling
            # nothing. A cron that is doing no work must not look identical to
            # one that is: an annotation puts it on the run summary and on the
            # Actions tab, where somebody will actually see it.
            echo "::warning title=Campaign tick did nothing::APP_URL / CRON_SECRET are not set in this repository's Actions secrets, so campaigns are not being advanced and call results are not being reconciled. See the setup notes at the top of .github/workflows/campaign-tick.yml"
            exit 0
          fi
          code=$(curl -sS -o /tmp/tick.json -w '%{http_code}' --max-time 280 \
            -X POST "$APP_URL/api/campaigns/tick" \
            -H "x-cron-secret: $CRON_SECRET")
          cat /tmp/tick.json
          echo
          # 401 means the secrets here and on Vercel disagree — fail loudly so
          # it shows up in the Actions tab instead of campaigns silently stalling.
          [ "$code" = "200" ] || { echo "tick failed with HTTP $code"; exit 1; }

      - name: Reconcile call results
        # Runs even when the tick above failed: the two are independent, and a
        # campaign that cannot dial is no reason to leave finished calls sitting
        # without their transcript.
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning title=Call sync did nothing::APP_URL / CRON_SECRET are not set, so finished calls are not having their transcript and recording pulled in."
            exit 0
          fi
          # Pulls results for calls still marked in-flight straight from the
          # provider, so a dropped webhook cannot lose a customer's transcript.
          code=$(curl -sS -o /tmp/sync.json -w '%{http_code}' --max-time 280 \
            -X POST "$APP_URL/api/calls/sync" \
            -H "x-cron-secret: $CRON_SECRET")
          cat /tmp/sync.json
          echo
          [ "$code" = "200" ] || { echo "sync failed with HTTP $code"; exit 1; }
